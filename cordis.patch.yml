# dsh-task-space — profile bundle patch (declared by package.json `dsh.bundle.patch`).
#
# One row hosts the plugin's Node half (index.js). The browser half
# (client.js) is discovered automatically from the package.json
# `dsh.client` declaration and needs no row of its own.
#
# `config` below is the default configuration layer. It can be overridden per
# profile here, from the Settings auto-form generated by the plugin's Config
# schema, or from the package-root `settings.yaml` file (highest precedence,
# see README.md "配置层级").

- insert:
    - id: task-space
      name: dsh-task-space
      # cordis resolves a fiber's service dependencies from the loader entry
      # options (`Inject.resolve(fiber.entry.options.inject, ...)`); declaring
      # them here guarantees ctx.webServer is available even when a loading
      # path drops the module-level `export const inject`.
      # ONLY webServer gates activation: registering /api/task-space routes
      # must happen as soon as the web server is up. Waiting on the heavy
      # services delayed route registration ~28s after boot and clicks in
      # that window returned the gateway's plain-text 404.
      # (workspaceController / sessionController / agentPresets / webRuntime
      # are resolved lazily per request inside index.js instead.)
      inject:
        - webServer
      config:
        rootDir: '~/.dsh/tasks'
        folderTemplate: '${YYYYMMDD}-${HHMMSS}-${taskShortId}'
        defaultPreset: 'standard'
        autoCleanDays: 0
